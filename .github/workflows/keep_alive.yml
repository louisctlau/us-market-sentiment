name: Keep app awake

on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Visit app
        run: python scripts/keep_awake.py
