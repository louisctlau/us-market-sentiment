# Keeps the Streamlit Community Cloud app from sleeping (it sleeps after
# 7 days with no traffic). Pings every 2 days; any HTTP hit resets the timer.
name: Keep app awake

on:
  schedule:
    # 09:00 UTC = 5:00 AM EDT (shifts to 4:00 AM EST in winter — harmless).
    - cron: "0 9 */2 * *"
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 \
              https://us-market-sentiment.streamlit.app/) || code="000"
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 45
          done
          echo "app did not return 200 after 3 attempts"
          exit 1
